<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Pins and Pixels</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .container { text-align: center; background: rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 20px; backdrop-filter: blur(10px); max-width: 600px; box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37); }
        h1 { color: #fff; font-size: 2.5em; margin-bottom: 20px; text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3); letter-spacing: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .arcade-container { margin: 40px auto; display: flex; justify-content: center; align-items: center; animation: glow 2s ease-in-out infinite; }
        @keyframes glow { 0%, 100% { filter: drop-shadow(0 0 10px rgba(255, 200, 100, 0.3)); } 50% { filter: drop-shadow(0 0 20px rgba(255, 200, 100, 0.6)); } }
        svg { width: 280px; height: 320px; filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3)); }
        p { color: #fff; font-size: 1.1em; line-height: 1.6; margin-top: 20px; }
        .footer { margin-top: 30px; color: rgba(255, 255, 255, 0.9); font-size: 1em; letter-spacing: 1px; }
    </style>
</head>

</body>
</html>
